name: Release

# One workflow for a release. Triggered by pushing a version tag (e.g. v3.4.0);
# also runnable manually (workflow_dispatch) as a dry run that verifies and
# builds everything but never publishes.
#
#   verify -> build-dist (sdist + wheel) --\
#   verify -> build-binaries (db CLI) -----+-> publish-pypi -> github-release
#
# PyPI publishing uses trusted publishing (OIDC), so no API token is stored.
# One-time setup (maintainer): on pypi.org > diffbot > Manage > Publishing, add
# a GitHub publisher with owner `diffbot`, repository `diffbot-python`,
# workflow `release.yml`, and NO environment (leave it blank).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

# Never cancel an in-flight run: a cancelled publish could leave PyPI with only
# some of the files for a version (PyPI doesn't allow re-uploading them) or
# leave PyPI and the GitHub Release out of sync. Runs for the same ref queue.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify version, tests, and types
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install dependencies (locked)
        run: uv sync --frozen --extra dev

      # __version__ is read from the installed distribution metadata, so this
      # checks that pyproject.toml's version is what the package reports.
      - name: Check tag matches package version
        run: |
          set -euo pipefail
          pkg=$(grep -m1 '^version' pyproject.toml | cut -d'"' -f2)
          runtime=$(uv run --frozen python -c 'import diffbot; print(diffbot.__version__)')
          if [ "$pkg" != "$runtime" ]; then
            echo "::error::pyproject.toml version ${pkg} does not match diffbot.__version__ ${runtime}."
            exit 1
          fi
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tag=${GITHUB_REF_NAME#v}
            if [ "$pkg" != "$tag" ]; then
              echo "::error::Tag v${tag} does not match pyproject.toml version ${pkg}. Bump pyproject.toml (e.g. 'make bump-patch') and re-tag."
              exit 1
            fi
          fi
          echo "Package version: ${pkg}"

      # Unit tests only: pyproject's addopts deselect `-m live` by default.
      - name: Run tests
        run: uv run --frozen pytest

      - name: Run pyright
        run: uv run --frozen pyright

  build-dist:
    name: Build sdist and wheel
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Build
        run: uv build --sdist --wheel --out-dir dist

      - name: Check distributions
        run: uvx twine check --strict dist/*

      - name: Check built version matches pyproject.toml
        run: |
          set -euo pipefail
          pkg=$(grep -m1 '^version' pyproject.toml | cut -d'"' -f2)
          ls dist
          test -f "dist/diffbot-${pkg}.tar.gz"
          test -f "dist/diffbot-${pkg}-py3-none-any.whl"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: dist/
          if-no-files-found: error

  build-binaries:
    needs: verify
    name: Build ${{ matrix.target_os }}-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    # Cap the wait so a capacity-starved runner fails this leg in minutes
    # instead of hanging the release for GitHub's 24h queue limit.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # Built on the oldest practical glibc for forward compatibility.
          - runner: ubuntu-22.04
            target_os: linux
            arch: x86_64
          # GitHub-hosted ARM Linux runner: free for public repos; requires a
          # Team/Enterprise plan for private repos.
          - runner: ubuntu-22.04-arm
            target_os: linux
            arch: aarch64
          # macOS is Apple Silicon only: GitHub's Intel (macos-13) runners are
          # being deprecated and their queue is unreliable. Intel-Mac users can
          # still `pip install diffbot`.
          - runner: macos-15        # Apple Silicon
            target_os: darwin
            arch: aarch64
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Build binary
        run: ./scripts/build_binary.sh --arch ${{ matrix.arch }}

      - name: Verify checksum
        working-directory: dist
        run: |
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum -c "db-${{ matrix.target_os }}-${{ matrix.arch }}.sha256"
          else
            shasum -a 256 -c "db-${{ matrix.target_os }}-${{ matrix.arch }}.sha256"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: db-${{ matrix.target_os }}-${{ matrix.arch }}
          path: |
            dist/db-${{ matrix.target_os }}-${{ matrix.arch }}
            dist/db-${{ matrix.target_os }}-${{ matrix.arch }}.sha256
          if-no-files-found: error

  publish-pypi:
    name: Publish to PyPI
    # Only after the sdist/wheel AND all db binaries built successfully.
    needs: [build-dist, build-binaries]
    # Tag pushes only; workflow_dispatch stops after the builds.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # No GitHub environment: the PyPI trusted publisher has none configured.
    permissions:
      id-token: write
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: dist/

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: Publish GitHub Release
    needs: [build-dist, build-binaries, publish-pypi]
    runs-on: ubuntu-latest
    # Only publish for real tag pushes; workflow_dispatch runs just build + verify.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List artifacts
        run: ls -lR dist

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        # This job doesn't check out the repo, so gh can't infer it from a local
        # git remote — pass --repo explicitly on every gh call.
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          repo="${GITHUB_REPOSITORY}"
          if gh release view "$tag" --repo "$repo" >/dev/null 2>&1; then
            echo "Release $tag exists; uploading assets (clobbering)."
            gh release upload "$tag" dist/* --repo "$repo" --clobber
          else
            echo "Creating release $tag."
            gh release create "$tag" \
              --repo "$repo" \
              --title "$tag" \
              --generate-notes \
              dist/*
          fi
