name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies (locked)
        run: uv sync --frozen --extra dev

      - name: Run tests
        run: uv run pytest

  # Catch breakage against the lowest dependency versions our ranges allow,
  # which the pinned lockfile would otherwise hide.
  test-lowest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.10"

      - name: Install lowest allowed dependencies
        run: uv sync --resolution lowest-direct --extra dev

      - name: Run tests
        run: uv run pytest
