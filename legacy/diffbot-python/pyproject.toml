# Final release under the old distribution name. diffbot-python was renamed to
# diffbot (3.0.0+). This release freezes the current library code under the old
# name and warns on import, so `pip install -U diffbot-python` keeps working
# while pointing users at the new package. It deliberately does NOT depend on
# diffbot: both ship the same top-level `diffbot` module, and installing them
# together lets pip delete one's files when it uninstalls the other.
#
# `make build-legacy` copies ../../src next to this file before building, so
# keep dependencies and scripts in step with the main pyproject.toml.
# Published with `make release-legacy`.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "diffbot-python"
version = "0.3.0"
description = "⚠️ LEGACY — renamed to diffbot. Final release, no further updates: pip install diffbot"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Jerome Choo", email = "jerome@diffbot.com" },
    { name = "Mike Tung", email = "miket@diffbot.com" }
]
classifiers = [
    "Development Status :: 7 - Inactive",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
]
dependencies = [
    "httpx>=0.27.0",
    "click>=8.1.0",
    "rich>=13.0.0",
]

[project.urls]
Homepage = "https://pypi.org/project/diffbot/"
Repository = "https://github.com/diffbot/diffbot-python"

[project.scripts]
db = "diffbot.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/diffbot"]
